steps:
  # Step 1: Install dependencies
  - name: 'gcr.io/cloud-builders/npm'
    args: ['ci']
    dir: '.'

  # Step 2: Run TypeScript check (optional, for early failure)
  - name: 'gcr.io/cloud-builders/npm'
    args: ['run', 'check']
    dir: '.'

  # Step 3: Build the application (generates dist/)
  - name: 'gcr.io/cloud-builders/npm'
    args: ['run', 'build']
    dir: '.'

  # Step 4: Run database migrations--
  # name: 'gcr.io/cloud-builders/npm'
  # args: ['run', 'db:push']
  # dir: '.'
  # env:
  #    - 'DATABASE_URL=${_DATABASE_URL}'  # Pass DB URL via substitution

  # Step 5: Deploy to Cloud Run from source (builds container automatically)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--source'
      - '.'
      - '--region'
      - '$_REGION'
      - '--platform'
      - 'managed'
      - '--verbosity=debug'
      - '--build-service-account'
      - 'projects/project-6d216afb-169c-4b20-942/serviceAccounts/cloud-run-deployer@project-6d216afb-169c-4b20-942.iam.gserviceaccount.com'
      # Mount Secret Manager secret as env var on Cloud Run (not plain env-vars)
      - '--set-secrets'
      - 'FCM_SERVICE_KEY=fcm-service-key:latest'

# Substitutions (define in trigger)
substitutions:
  _SERVICE_NAME: exam-vault  # Your Cloud Run service name
  _REGION: europe-west3
  _PROJECT_ID: project-6d216afb-169c-4b20-942  # Replace with your GCP project ID
  _DATABASE_URL: 'postgresql://exampro-user:Vendetta%401983@/exampro-db?host=/cloudsql/project-6d216afb-169c-4b20-942:europe-west3:examvaultv1-sb'  # Replace <DB_HOST> with your DB connection string


options:
  logging: CLOUD_LOGGING_ONLY